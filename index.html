<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биология тесті</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef7ee;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #3d7a4b;
        }

        #progress {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
            font-size: 18px;
        }

        #question {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .answer {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #d5e5d5;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
        }

        .answer:hover {
            background: #f0f8f0;
        }

        .answer.selected {
            background: #d9f0dc;
            border-color: #5b9b68;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #5b9b68;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #477d52;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #result {
            display: none;
        }

        .wrong {
            background: #fff0f0;
            border-left: 5px solid #d9534f;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .correct-answer {
            color: green;
            font-weight: bold;
        }

        .your-answer {
            color: #d9534f;
        }

        .restart {
            display: block;
            margin: 25px auto 0;
        }
    </style>
</head>

        <div class="buttons">

            <button id="backButton" onclick="previousQuestion()">
                ← Артқа
            </button>

            <button id="nextButton" onclick="nextQuestion()">
                Келесі →

        </div>

    </div>


    <div id="result">

        <h1>🎉 Нәтиже</h1>

        <div id="mistakes"></div>

let currentQuestion = 0;

let userAnswers = new Array(questions.length).fill(null);


function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Сұрақ ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("question").textContent =
        q.question;

    const answersBlock =
        document.getElementById("answers");

    answersBlock.innerHTML = "";


    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;


        if (userAnswers[currentQuestion] === index) {

            button.classList.add("selected");

        }


        button.onclick = function() {

            userAnswers[currentQuestion] = index;

            showQuestion();

        };


        answersBlock.appendChild(button);

    });


    document.getElementById("backButton").disabled =
        currentQuestion === 0;


    if (currentQuestion === questions.length - 1) {

        document.getElementById("nextButton").textContent =
            "Аяқтау";

    } else {

        document.getElementById("nextButton").textContent =
            "Келесі →";

    }

}


function nextQuestion() {

    if (userAnswers[currentQuestion] === null) {

        alert("Алдымен жауапты таңда!");

        return;

    }


    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

    } else {

        finishTest();

    }

}


function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

}


function finishTest() {

    const unanswered =
        userAnswers.some(answer => answer === null);


    if (unanswered) {

        alert("Барлық сұраққа жауап бер!");

        return;

    }


    let score = 0;

    let mistakesHTML = "";


    questions.forEach((q, index) => {

        if (userAnswers[index] === q.correct) {

            score++;

        } else {

            mistakesHTML += `

                <div class="wrong">

                    <b>
                        ${index + 1}. ${q.question}
                    </b>

                    <p class="your-answer">
                        Сенің жауабың:
                        ${q.answers[userAnswers[index]]}
                    </p>

                    <p class="correct-answer">
                        Дұрыс жауап:
                        ${q.answers[q.correct]}
                    </p>

                </div>

            `;

        }

    });


    const percentage =
        Math.round((score / questions.length) * 100);


    document.getElementById("test").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";


    document.getElementById("score").textContent =
        `Нәтиже: ${score} / ${questions.length} (${percentage}%)`;


    if (mistakesHTML === "") {

        document.getElementById("mistakes").innerHTML =
            "<h2>🌟 Барлық жауап дұрыс!</h2>";

    } else {

        document.getElementById("mistakes").innerHTML =
            "<h2>Қателер:</h2>" + mistakesHTML;

    }

}


function restartTest() {

    currentQuestion = 0;

    userAnswers =
        new Array(questions.length).fill(null);


    document.getElementById("result").style.display =
        "none";

    document.getElementById("test").style.display =
        "block";


    showQuestion();

}


showQuestion();
